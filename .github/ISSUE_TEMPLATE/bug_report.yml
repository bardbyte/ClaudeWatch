name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill out the details below.
  - type: input
    id: version
    attributes:
      label: ClaudeWatch version
      placeholder: "e.g., v1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g., macOS 15.1 Sequoia"
    validations:
      required: true
  - type: input
    id: chip
    attributes:
      label: Chip
      placeholder: "e.g., Apple M1, Intel i7"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: Describe the expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ClaudeWatch
        2. ...
    validations:
      required: true
